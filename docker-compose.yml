services:
  redis:
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    command: ["/entrypoint.sh", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"

  poller:
    build: ./poller
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      INVERTER_HOST: ${INVERTER_HOST:-192.168.0.174}
      INVERTER_PORT: ${INVERTER_PORT:-502}
      MODBUS_UNIT: ${MODBUS_UNIT:-1}
      MODBUS_TIMEOUT: ${MODBUS_TIMEOUT:-5}
      POLL_INTERVAL: ${POLL_INTERVAL:-10}
      SOLAREDGE_BATTERIES: ${SOLAREDGE_BATTERIES:-}
      SOLAREDGE_METERS: ${SOLAREDGE_METERS:-}
      TS_RETENTION_DAYS: ${TS_RETENTION_DAYS:-365}
      LAT: ${LAT:-}
      LON: ${LON:-}
      TIMEZONE: ${TIMEZONE:-UTC}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # After this long without a successful poll, "latest" values are removed instead of shown
      # frozen and increasingly wrong; the time series (history graphs) already show a gap on their own.
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-120}

  hoymiles-poller:
    build: ./hoymiles-poller
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      HOYMILES_USER: ${HOYMILES_USER}
      HOYMILES_PASSWORD: ${HOYMILES_PASSWORD}
      # Optional "id:name,id:name" override; leave unset to auto-discover all stations.
      HOYMILES_STATIONS: ${HOYMILES_STATIONS:-}
      HOYMILES_POLL_INTERVAL: ${HOYMILES_POLL_INTERVAL:-300}
      # Cloud data is already up to 5 minutes old by nature, hence the longer default than the
      # other pollers' STALE_AFTER_SECONDS.
      STALE_AFTER_SECONDS: ${HOYMILES_STALE_AFTER_SECONDS:-900}
      TS_RETENTION_DAYS: ${TS_RETENTION_DAYS:-365}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  weishaupt-poller:
    build: ./weishaupt-poller
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      # Leave WEISHAUPT_HOST empty if you have no Weishaupt heat pump: the poller then just idles.
      WEISHAUPT_HOST: ${WEISHAUPT_HOST:-}
      WEISHAUPT_PORT: ${WEISHAUPT_PORT:-502}
      WEISHAUPT_UNIT: ${WEISHAUPT_UNIT:-1}
      WEISHAUPT_NAME: ${WEISHAUPT_NAME:-wgb14}
      WEISHAUPT_HEATING_CIRCUITS: ${WEISHAUPT_HEATING_CIRCUITS:-2}
      WEISHAUPT_POLL_INTERVAL: ${WEISHAUPT_POLL_INTERVAL:-30}
      STALE_AFTER_SECONDS: ${WEISHAUPT_STALE_AFTER_SECONDS:-120}
      MODBUS_TIMEOUT: ${MODBUS_TIMEOUT:-5}
      TS_RETENTION_DAYS: ${TS_RETENTION_DAYS:-365}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  # Web form for entering the heat pump's electricity meter reading by hand. No login of its
  # own: Caddy only lets logged-in Grafana users reach it (https://<GRAFANA_DOMAIN>/meter/).
  meter-form:
    build: ./meter-form
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "127.0.0.1:8000:8000"  # loopback only, for local testing / an SSH tunnel
    environment:
      WEISHAUPT_NAME: ${WEISHAUPT_NAME:-wgb14}
      TIMEZONE: ${TIMEZONE:-UTC}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  # Decides when the compute machines (PrimeGrid) should run, from the PV surplus and a forecast.
  # Dry run only: it records what it *would* switch, nothing is switched yet.
  # Reads Shelly Gen3+ smart plugs locally (no cloud); each plug's name should match a machine
  # name in COMPUTE_MACHINES so compute-controller picks up its real wattage automatically
  # (machine_power() reads compute:<name>:latest, which this poller feeds -- see its docstring).
  shelly-poller:
    build: ./shelly-poller
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      # "name:host,name:host"; leave empty if you have no Shelly plugs yet.
      SHELLY_DEVICES: ${SHELLY_DEVICES:-}
      SHELLY_POLL_INTERVAL: ${SHELLY_POLL_INTERVAL:-10}
      SHELLY_STALE_AFTER_SECONDS: ${SHELLY_STALE_AFTER_SECONDS:-60}
      TS_RETENTION_DAYS: ${TS_RETENTION_DAYS:-365}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  compute-controller:
    build: ./compute-controller
    restart: unless-stopped
    depends_on:
      - redis
    # TUYA_<NAME>_ID/KEY/IP/VERSION/DPS_SWITCH are named after each "tuya"-kind entry in
    # COMPUTE_MACHINES, so they can't be listed individually below like the fixed COMPUTE_*
    # settings -- env_file passes the whole .env through, which picks up any of them.
    env_file:
      - .env
    environment:
      # "name:watts,name:watts" in priority order (first is started first, stopped last).
      # Leave empty if you have no such machines: the controller then idles.
      COMPUTE_MACHINES: ${COMPUTE_MACHINES:-}
      COMPUTE_MODE: ${COMPUTE_MODE:-dryrun}
      COMPUTE_MARGIN_ON_W: ${COMPUTE_MARGIN_ON_W:-200}
      COMPUTE_TOLERANCE_OFF_W: ${COMPUTE_TOLERANCE_OFF_W:-100}
      COMPUTE_SMOOTH_MIN: ${COMPUTE_SMOOTH_MIN:-15}
      COMPUTE_ON_DELAY_MIN: ${COMPUTE_ON_DELAY_MIN:-15}
      COMPUTE_OFF_DELAY_MIN: ${COMPUTE_OFF_DELAY_MIN:-20}
      COMPUTE_MIN_ON_MIN: ${COMPUTE_MIN_ON_MIN:-45}
      COMPUTE_MIN_OFF_MIN: ${COMPUTE_MIN_OFF_MIN:-45}
      COMPUTE_SOC_ON: ${COMPUTE_SOC_ON:-80}
      COMPUTE_SOC_MIN: ${COMPUTE_SOC_MIN:-40}
      COMPUTE_SOC_FC_OFF: ${COMPUTE_SOC_FC_OFF:-95}
      LAT: ${LAT:-}
      LON: ${LON:-}
      TIMEZONE: ${TIMEZONE:-UTC}
      TS_RETENTION_DAYS: ${TS_RETENTION_DAYS:-365}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Private key for real "pc" actuation (SSH shutdown/sleep, see pc_actuator.py). Generated on
      # the Pi with `ssh-keygen -f compute-controller-ssh/id_ed25519` (never in git -- see
      # .gitignore); its public half then goes into each managed PC's authorized_keys.
      PC_SSH_KEY_PATH: /run/secrets/pc-ssh/id_ed25519
    volumes:
      - ./compute-controller-ssh:/run/secrets/pc-ssh:ro

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      # Without the 127.0.0.1 binding: reachable from the whole LAN at http://<docker-host-ip>:3000
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: redis-datasource
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Public URL of Grafana; the Google redirect URI is derived from it (<root_url>login/google).
      # The default equals Grafana's own default.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      # Optional "Sign in with Google" -- off unless GOOGLE_OAUTH_ENABLED=true (see README).
      GF_AUTH_GOOGLE_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GF_AUTH_GOOGLE_NAME: Google
      GF_AUTH_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GF_AUTH_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GF_AUTH_GOOGLE_SCOPES: openid email profile
      GF_AUTH_GOOGLE_USE_PKCE: "true"
      # Default: only existing Grafana users (matched by email) may log in via Google.
      GF_AUTH_GOOGLE_ALLOW_SIGN_UP: ${GOOGLE_ALLOW_SIGN_UP:-false}
      GF_AUTH_GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      GF_AUTH_GOOGLE_AUTO_LOGIN: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Reverse proxy: HTTPS for Grafana (needed for "Sign in with Google") and short
  # names on port 80. Only started with the "proxy" profile, because it takes over
  # ports 80/443 -- on the Pi, move the Pi-hole web UI to 8080/8443 first (see README).
  # Enable with COMPOSE_PROFILES=proxy in .env.
  caddy:
    build: ./caddy
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - grafana
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:-localhost}
      ACMEDNS_USERNAME: ${ACMEDNS_USERNAME:-}
      ACMEDNS_PASSWORD: ${ACMEDNS_PASSWORD:-}
      ACMEDNS_SUBDOMAIN: ${ACMEDNS_SUBDOMAIN:-}
      ACMEDNS_SERVER_URL: ${ACMEDNS_SERVER_URL:-https://auth.acme-dns.io}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/pwa:/srv/pwa:ro
      - caddy-data:/data
      - caddy-config:/config

  grafana-init:
    build: ./grafana-init
    restart: "no"
    depends_on:
      grafana:
        condition: service_healthy
    environment:
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Format: "login:password:role,login2:password2:role2" -- role is Viewer/Editor/Admin (default Viewer)
      GRAFANA_USERS: ${GRAFANA_USERS:-}

volumes:
  redis-data:
  grafana-data:
  caddy-data:
  caddy-config:
