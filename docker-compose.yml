services:
  redis:
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    command: ["/entrypoint.sh", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"

  poller:
    build: ./poller
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      INVERTER_HOST: ${INVERTER_HOST:-192.168.0.174}
      INVERTER_PORT: ${INVERTER_PORT:-502}
      MODBUS_UNIT: ${MODBUS_UNIT:-1}
      MODBUS_TIMEOUT: ${MODBUS_TIMEOUT:-5}
      POLL_INTERVAL: ${POLL_INTERVAL:-10}
      TS_RETENTION_DAYS: ${TS_RETENTION_DAYS:-365}
      LAT: ${LAT:-}
      LON: ${LON:-}
      TIMEZONE: ${TIMEZONE:-UTC}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  hoymiles-poller:
    build: ./hoymiles-poller
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      HOYMILES_USER: ${HOYMILES_USER}
      HOYMILES_PASSWORD: ${HOYMILES_PASSWORD}
      # Optional "id:name,id:name" override; leave unset to auto-discover all stations.
      HOYMILES_STATIONS: ${HOYMILES_STATIONS:-}
      HOYMILES_POLL_INTERVAL: ${HOYMILES_POLL_INTERVAL:-300}
      TS_RETENTION_DAYS: ${TS_RETENTION_DAYS:-365}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      # Without the 127.0.0.1 binding: reachable from the whole LAN at http://<docker-host-ip>:3000
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: redis-datasource
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Public URL of Grafana; the Google redirect URI is derived from it (<root_url>login/google).
      # The default equals Grafana's own default.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      # Optional "Sign in with Google" -- off unless GOOGLE_OAUTH_ENABLED=true (see README).
      GF_AUTH_GOOGLE_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GF_AUTH_GOOGLE_NAME: Google
      GF_AUTH_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GF_AUTH_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GF_AUTH_GOOGLE_SCOPES: openid email profile
      GF_AUTH_GOOGLE_USE_PKCE: "true"
      # Default: only existing Grafana users (matched by email) may log in via Google.
      GF_AUTH_GOOGLE_ALLOW_SIGN_UP: ${GOOGLE_ALLOW_SIGN_UP:-false}
      GF_AUTH_GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      GF_AUTH_GOOGLE_AUTO_LOGIN: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Reverse proxy: HTTPS for Grafana (needed for "Sign in with Google") and short
  # names on port 80. Only started with the "proxy" profile, because it takes over
  # ports 80/443 -- on the Pi, move the Pi-hole web UI to 8080/8443 first (see README).
  # Enable with COMPOSE_PROFILES=proxy in .env.
  caddy:
    build: ./caddy
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - grafana
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:-localhost}
      ACMEDNS_USERNAME: ${ACMEDNS_USERNAME:-}
      ACMEDNS_PASSWORD: ${ACMEDNS_PASSWORD:-}
      ACMEDNS_SUBDOMAIN: ${ACMEDNS_SUBDOMAIN:-}
      ACMEDNS_SERVER_URL: ${ACMEDNS_SERVER_URL:-https://auth.acme-dns.io}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  grafana-init:
    build: ./grafana-init
    restart: "no"
    depends_on:
      grafana:
        condition: service_healthy
    environment:
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Format: "login:password:role,login2:password2:role2" -- role is Viewer/Editor/Admin (default Viewer)
      GRAFANA_USERS: ${GRAFANA_USERS:-}

volumes:
  redis-data:
  grafana-data:
  caddy-data:
  caddy-config:
